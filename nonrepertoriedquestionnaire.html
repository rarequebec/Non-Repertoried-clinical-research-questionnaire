<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RARE.Qc | Non-repertoried Clinical Research Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- SheetJS (xlsx) — same library and CDN as resourcesquestionnaire.html.
     Used only to build the .xlsx file attached to the submission email. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =====================================================================
   RARE.Qc NON-REPERTORIED CLINICAL RESEARCH SURVEY — STYLE SHEET
   Design tokens copied from resourcesquestionnaire.html for consistency.
   ===================================================================== */
:root{
  --paper:#FCF8F9; --surface:#FFFFFF; --surface-sunk:#F8EFF3;
  --ink:#2A1F25; --ink-soft:#66525C; --ink-faint:#9C8892;
  --line:#EBDAE2; --line-soft:#F4E9EE;
  --teal-900:#4A1530; --teal-700:#8A2E5A; --teal-600:#A3386B; --teal-500:#C2547F; --teal-100:#F9E6EF;  /* rose/berry palette (names kept from the original teal theme) */
  --amber-600:#A86E1E; --amber-100:#F6EADA; --amber-50:#FCF7EF;
  --clay-600:#B4553B; --clay-100:#F3E2DB;
  --ok:#2E7D4F; --ok-bg:#E6F2EA; --warn:#B4553B; --warn-bg:#F8E9E5;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --font-display:"Fraunces", Georgia, serif;
  --font-body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --shadow-1:0 1px 2px rgba(74,21,48,0.06), 0 1px 1px rgba(74,21,48,0.04);
  --shadow-2:0 6px 20px rgba(74,21,48,0.10);
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{ background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
h1,h2,h3{ margin:0; font-family:var(--font-display); font-weight:600; color:var(--teal-900); }
p{ margin:0 0 .6em; }
button{ font-family:inherit; cursor:pointer; }
input,select,textarea{ font-family:inherit; font-size:13.5px; }
a{ color:var(--teal-600); }
:focus-visible{ outline:2px solid var(--teal-500); outline-offset:2px; }

/* ---------- top bar: logo, autosave status, language switch ---------- */
.topbar{ position:sticky; top:0; z-index:60; background:var(--teal-900); color:#F8EAF0; padding:10px 20px; display:flex; align-items:center; gap:14px; }
.topbar .logo-img{ height:34px; width:auto; display:block; }
.topbar .bar-title{ font-family:var(--font-display); font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:14px; border-left:1px solid rgba(255,255,255,.25); }
.topbar .spacer{ flex:1; }
.topbar .save-state{ font-size:12.5px; color:#EEC6D7; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.topbar .save-dot{ width:7px; height:7px; border-radius:50%; background:#6FCB9E; box-shadow:0 0 0 3px rgba(111,203,158,.2); flex:none; }
.lang-toggle{ display:flex; border:1px solid rgba(255,255,255,.35); border-radius:var(--radius-sm); overflow:hidden; font-size:13px; flex:none; }
.lang-toggle button{ background:transparent; color:#EEC6D7; border:none; padding:7px 12px; font-weight:500; }
.lang-toggle button.active{ background:rgba(255,255,255,.18); color:#fff; font-weight:700; }
@media (max-width:900px){ .topbar .bar-title{ display:none; } }
@media (max-width:520px){ .topbar{ padding:10px 16px; gap:10px; } .topbar .logo-img{ height:28px; } .topbar .save-state span:last-child{ display:none; } }

/* ---------- page ---------- */
.shell{ width:100%; max-width:1480px; margin:0 auto; padding:26px 20px 80px; }
@media (max-width:520px){ .shell{ padding:20px 16px 60px; } }
.hero{ text-align:center; margin-bottom:22px; }
.hero .logo{ height:72px; width:auto; display:block; margin:0 auto 14px; }
.hero h1{ font-size:28px; line-height:1.2; margin-bottom:10px; }
.hero p{ color:var(--ink-soft); font-size:14.5px; max-width:720px; margin:0 auto 8px; }
.hero p a{ color:var(--teal-600); font-weight:600; }
.hero .save-line{ display:inline-flex; align-items:center; gap:7px; font-size:13.5px; color:var(--teal-700); background:var(--teal-100); border-radius:999px; padding:5px 14px; margin-top:8px; }
.hero .save-line .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); }
@media (max-width:640px){ .hero .logo{ height:54px; } .hero h1{ font-size:23px; } }

/* ---------- notes on columns ---------- */
.grid th .th-note{ display:block; font-weight:400; font-size:11.5px; color:var(--ink-soft); line-height:1.4; margin-top:4px; }

/* PI name block (below the table) */
.pi-block{ margin-top:18px; background:var(--amber-50); border:1px solid #EAD7B8; border-radius:var(--radius-md); padding:16px 20px; }
.pi-block label{ display:block; font-size:14px; font-weight:600; color:var(--ink); margin-bottom:6px; }
.pi-block .internal-tag{ display:inline-block; margin:0 0 0 8px; vertical-align:1px; }
.pi-block input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); min-height:42px; font-size:14px; }
.pi-block input:focus{ border-color:var(--teal-500); outline:none; box-shadow:0 0 0 3px var(--teal-100); }
.pi-block .help{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }

.excel-bar{ display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md); padding:12px 16px; margin-top:16px; }
.excel-bar .xl-icon{ width:34px; height:34px; border-radius:8px; background:var(--teal-100); color:var(--teal-700); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px; letter-spacing:.3px; flex:none; }
.excel-bar .xl-text{ flex:1; min-width:240px; font-size:13.5px; color:var(--ink-soft); }
.excel-bar .xl-text b{ color:var(--ink); }
.excel-bar .btn{ padding:9px 14px; font-size:13.5px; }
@media (max-width:640px){ .excel-bar .btn{ flex:1; } }
.import-notes{ margin-top:12px; background:var(--amber-100); border:1px solid #EAD7B8; color:#6B4A12; border-radius:var(--radius-md); padding:10px 14px; font-size:13px; }
.import-notes ul{ margin:4px 0 0; padding-left:18px; }
.import-notes .close{ float:right; background:none; border:none; color:#6B4A12; font-size:14px; }
.table-hint{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft); margin:0 2px 8px; }
.table-hint .count{ font-weight:600; color:var(--teal-700); }
.table-hint .scroll-hint{ margin-left:auto; color:var(--ink-faint); font-size:12.5px; }

/* ---------- the spreadsheet-style table ---------- */
.table-wrap{
  background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--teal-500);
  border-radius:var(--radius-md); box-shadow:var(--shadow-1);
  overflow:auto; max-height:calc(100vh - 150px); min-height:220px;
}
table.grid{ border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
.grid th, .grid td{ border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); vertical-align:top; }
.grid thead th{
  position:sticky; top:0; z-index:3; background:var(--surface-sunk); text-align:left;
  font-size:12.5px; font-weight:600; color:var(--ink); padding:9px 10px; line-height:1.3; border-bottom:1px solid var(--line);
}
.grid thead tr.r2 th{ top:var(--head1-h, 36px); font-weight:500; color:var(--ink-soft); }
.grid thead th.group{ text-align:center; }
.grid th .req{ color:var(--clay-600); margin-left:2px; }
.grid th .info{ display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:50%; background:var(--teal-100); color:var(--teal-700); font-size:10px; font-weight:700; margin-left:5px; cursor:help; vertical-align:1px; }
.internal-tag{ display:block; width:max-content; font-size:10.5px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; color:var(--amber-600); margin-top:3px; }

/* sticky row number + study name on wide screens */
.grid .c-n{ width:42px; min-width:42px; text-align:center; color:var(--ink-faint); font-size:12px; padding-top:13px; background:var(--surface-sunk); }
@media (min-width:760px){
  .grid .c-n{ position:sticky; left:0; z-index:2; }
  .grid .c-name{ position:sticky; left:42px; z-index:2; background:var(--surface); box-shadow:2px 0 0 var(--line); }
  .grid thead .c-n, .grid thead .c-name{ z-index:5; background:var(--surface-sunk); }
}
.grid td{ padding:4px; background:var(--surface); }
.grid td.c-n{ background:var(--surface-sunk); }
.grid tbody tr:hover td:not(.c-n){ background:#FFFAFC; }

.grid input[type=text], .grid input[type=url], .grid input[type=date], .grid select, .grid textarea{
  width:100%; border:1px solid transparent; background:transparent; padding:7px 8px; border-radius:var(--radius-sm); color:var(--ink); min-height:36px;
}
.grid textarea{ resize:none; overflow:hidden; line-height:1.4; display:block; }
.grid select{ border-color:var(--line-soft); background:var(--surface); cursor:pointer; }
.grid input:hover, .grid textarea:hover{ border-color:var(--line); }
.grid input:focus, .grid select:focus, .grid textarea:focus{ border-color:var(--teal-500); background:var(--surface); outline:none; box-shadow:0 0 0 3px var(--teal-100); }
.grid input:disabled{ color:var(--ink-faint); background:var(--surface-sunk); }
.grid .other-input{ margin-top:4px; border-color:var(--line) !important; }
::placeholder{ font-style:italic; color:var(--ink-faint); opacity:1; }

.grid td.invalid input, .grid td.invalid select, .grid td.invalid textarea{ border-color:var(--warn) !important; background:var(--warn-bg) !important; }
.cell-error{ display:none; font-size:11.5px; color:var(--warn); padding:2px 8px 0; }
.grid td.invalid .cell-error{ display:block; }

.check-inline{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); padding:4px 8px 2px; cursor:pointer; }
.check-inline input{ accent-color:var(--teal-600); margin:0; }

/* sites inside a cell */
.site-row{ display:flex; align-items:center; gap:2px; }
.site-row + .site-row{ margin-top:2px; }
.site-row input{ flex:1; }
.mini-remove{ background:none; border:none; color:var(--ink-faint); font-size:13px; width:26px; height:30px; border-radius:var(--radius-sm); flex:none; }
.mini-remove:hover{ color:var(--warn); background:var(--warn-bg); }
.mini-add{ background:none; border:none; color:var(--teal-600); font-size:12px; font-weight:600; padding:4px 8px; }
.mini-add:hover{ text-decoration:underline; }

.row-remove-btn{ background:none; border:1px solid var(--line); color:var(--warn); border-radius:var(--radius-sm); width:32px; height:32px; margin:2px auto 0; display:block; font-size:13px; }
.row-remove-btn:hover{ background:var(--warn-bg); }
.add-row-btn{
  display:block; width:100%; border:none; border-top:1px dashed var(--line); background:var(--teal-100); color:var(--teal-700);
  padding:11px; font-weight:600; font-size:13.5px; position:sticky; left:0;
}
.add-row-btn:hover{ background:#F3D5E3; }

/* ---------- buttons / actions ---------- */
.btn{ padding:11px 20px; border-radius:var(--radius-sm); font-size:14px; font-weight:600; border:1px solid transparent; }
.btn-primary{ background:var(--teal-700); color:#fff; }
.btn-primary:hover{ background:var(--teal-900); }
.btn-secondary{ background:var(--surface); color:var(--teal-700); border-color:var(--teal-500); }
.btn-secondary:hover{ background:var(--teal-100); }
.btn-text{ background:none; color:var(--ink-soft); border:none; text-decoration:underline; padding:11px 6px; font-size:13.5px; }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px; }
.actions .note-save{ flex:1; font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:7px; min-width:220px; }
.actions .note-save .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none; }
@media (max-width:640px){ .actions .btn-primary{ width:100%; } }

.error-list{ margin-top:12px; background:var(--warn-bg); border:1px solid #EBC9BE; color:#7A3422; border-radius:var(--radius-md); padding:10px 14px; font-size:13px; }
.error-list ul{ margin:4px 0 0; padding-left:18px; }

/* ---------- confirm panel ---------- */
.review{ margin-top:18px; border:1px solid var(--teal-500); background:var(--surface); border-radius:var(--radius-lg); padding:20px 24px; box-shadow:var(--shadow-2); max-width:760px; margin-left:auto; }
.review h2{ font-size:20px; margin-bottom:4px; }
.review .muted{ color:var(--ink-soft); font-size:13px; margin-bottom:10px; }
.review ol{ margin:0 0 6px; padding-left:22px; font-size:13.5px; }
.review ol li{ padding:3px 0; }
.review ol li .meta{ color:var(--ink-faint); }
.review .actions{ justify-content:flex-end; }

/* ---------- confirmation / toast ---------- */
.done{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-1); text-align:center; padding:34px 24px; max-width:760px; margin:0 auto; }
.done .tick{ width:52px; height:52px; border-radius:50%; background:var(--ok-bg); color:var(--ok); font-size:26px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.done h2{ font-size:22px; margin-bottom:8px; }
.done p{ color:var(--ink-soft); }
.toast{ position:fixed; bottom:20px; right:20px; background:var(--teal-900); color:#fff; padding:11px 16px; border-radius:var(--radius-sm); font-size:13px; box-shadow:var(--shadow-2); z-index:200; opacity:0; transform:translateY(8px); transition:all .25s ease; pointer-events:none; max-width:380px; }
.toast.show{ opacity:1; transform:translateY(0); }
@media (max-width:640px){ .toast{ left:16px; right:16px; max-width:none; } }
.hidden{ display:none !important; }
</style>
</head>

   ===================================================================== */

/* ================== PART B — STATE & PERSISTENCE ==================== */
const STORAGE_KEY = "rareqc_nonrepertoried_survey_v2";   // separate from the inventory survey's key
const AUTOSAVE_MS = 1500;

function rowId(){ return "s_" + Math.random().toString(36).slice(2,10); }

// One study = one row (public information only). The PI name is entered once,
// below the table, and kept in STATE.internal so it never mixes with public data.
function blankStudy(){
  return {
    id: rowId(),
    name:"", code:"",
    status:"", statusOther:"",
    condition:"",
    typeId:"", typeOther:"",
    startDate:"", endDate:"", ongoing:false,
    sites:[""], sponsor:"", url:""
  };
}
function freshState(lang){
  return { studies:[blankStudy()], internal:{ piName:"" }, ui:{ lang: lang || "en", reviewing:false, done:false, doneCount:0 } };
}
let STATE = freshState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    const base = freshState();
    STATE.ui = Object.assign(base.ui, saved.ui || {});
    const rows = Array.isArray(saved.studies) ? saved.studies : [];
    STATE.internal = Object.assign({ piName:"" }, saved.internal || {});
    // Older saves kept a PI name per row: merge those into the single field.
    const legacyPis = rows.map(r => (r.internal && r.internal.piName || "").trim()).filter(Boolean);
    if(!STATE.internal.piName && legacyPis.length) STATE.internal.piName = Array.from(new Set(legacyPis)).join("; ");
    STATE.studies = rows.map(r=>{
      const s = Object.assign(blankStudy(), r);
      delete s.internal;
      if(!Array.isArray(s.sites) || !s.sites.length) s.sites = [""];
      return s;
    });
    if(!STATE.studies.length) STATE.studies = [blankStudy()];
    return STATE.studies.some(s => !isEmptyStudy(s)) || !!STATE.internal.piName.trim();
  }catch(e){ console.warn("State load failed.", e); return false; }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }
  catch(e){ console.warn("State save failed.", e); return; }
  const label = document.getElementById("saveLabel");
  if(label) label.textContent = t("savedAt") + " " + new Date().toLocaleTimeString(isFr() ? "fr-CA" : "en-CA", {hour:"2-digit", minute:"2-digit"});
}
let autosaveTimer = null;
function scheduleAutosave(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(saveState, AUTOSAVE_MS); }

function isEmptyStudy(s){
  return !(s.name.trim() || s.code.trim() || s.status || s.statusOther.trim() || s.condition.trim() ||
    s.typeId || s.typeOther.trim() || s.startDate || s.endDate || s.ongoing || s.sponsor.trim() ||
    s.url.trim() || s.sites.some(v => v && v.trim()));
}
function filledStudies(){ return STATE.studies.filter(s => !isEmptyStudy(s)); }

function clearAll(){
  if(!window.confirm(t("clearConfirm"))) return;
  STATE = freshState(STATE.ui.lang);
  saveState();
  renderApp();
  toast(t("clearDone"));
}

/* ================== PART C — VALIDATION ============================= */
function normalizeUrl(v){
  v = (v || "").trim();
  // Convenience: "www.lab.ca" -> "https://www.lab.ca"
  if(v && !/^[a-z][a-z0-9+.-]*:\/\//i.test(v) && /^[^\s]+\.[^\s]+$/.test(v)) v = "https://" + v;
  return v;
}
// Errors for one study: { columnKey: stringKey }. Empty rows are never invalid.
function studyErrors(s){
  const e = {};
  if(isEmptyStudy(s)) return e;
  if(!s.name.trim()) e.name = "fieldRequired";
  if(!s.status) e.status = "statusRequired";
  else if(s.status === "other" && !s.statusOther.trim()) e.status = "otherRequired";
  if(s.typeId === "other" && !s.typeOther.trim()) e.type = "otherRequired";
  if(s.startDate && s.endDate && !s.ongoing && s.endDate < s.startDate) e.end = "endBeforeStart";
  if(s.url.trim() && !URL_REGEX.test(s.url.trim())) e.url = "invalidUrl";
  return e;
}
function allErrors(){
  const out = [];
  STATE.studies.forEach((s, i)=>{ const e = studyErrors(s); if(Object.keys(e).length) out.push({ index:i, id:s.id, errors:e }); });
  return out;
}
function paintCell(td, errKey){
  td.classList.toggle("invalid", !!errKey);
  const msg = td.querySelector(":scope > .cell-error");
  if(msg) msg.textContent = errKey ? t(errKey) : "";
}
// Paint every cell of every row; optionally only clear (never add) errors.
function paintErrors(onlyClear){
  STATE.studies.forEach(s=>{
    const e = studyErrors(s);
    document.querySelectorAll('tr[data-row="'+s.id+'"] td[data-col]').forEach(td=>{
      const key = td.getAttribute("data-col");
      if(onlyClear && !td.classList.contains("invalid")) return;
      paintCell(td, e[key]);
    });
  });
}

/* ================== PART D — RENDER ================================= */
function t(key){
  const dict = UI_STRINGS[STATE.ui.lang] || UI_STRINGS.en;
  return dict[key] !== undefined ? dict[key] : (UI_STRINGS.en[key] !== undefined ? UI_STRINGS.en[key] : key);
}
function isFr(){ return STATE.ui.lang === "fr"; }
function optLabel(list, id, lang){ const o = list.find(x => x.id === id); return o ? o[lang || STATE.ui.lang] : ""; }
function countLabel(n){ return n === 1 ? t("studyCount1") : t("studyCountN").replace("{n}", n); }

function el(tag, attrs, children){
  const node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(k=>{
    const v = attrs[k];
    if(v === undefined || v === null || v === false) return;
    if(k === "class") node.className = v;
    else if(k === "html") node.innerHTML = v;
    else if(k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  });
  (children || []).forEach(c=>{ if(c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return node;
}
function toast(msg){
  const tEl = document.getElementById("toast");
  tEl.textContent = msg; tEl.classList.add("show");
  clearTimeout(tEl._timer); tEl._timer = setTimeout(()=> tEl.classList.remove("show"), 3600);
}
function autoGrow(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

// Called after every edit: autosave, clear fixed errors, refresh counters/review.
function onEdit(){
  scheduleAutosave();
  paintErrors(true);
  updateCount();
  refreshReview();
  if(STATE.ui.reviewing) renderErrorList();
}

/* ---- column definitions (order = table order) ---- */
const COLUMNS = [
  { key:"name",      label:"colName",      w:250, required:true },
  { key:"code",      label:"colCode",      w:200, note:"codeTip" },
  { key:"status",    label:"colStatus",    w:200, required:true },
  { key:"condition", label:"colCondition", w:290, note:"noteCondition" },
  { key:"type",      label:"colType",      w:240 },
  { key:"start",     label:"colStart",     w:150, group:"colPeriod" },
  { key:"end",       label:"colEnd",       w:165, group:"colPeriod" },
  { key:"sites",     label:"colSites",     w:240 },
  { key:"sponsor",   label:"colSponsor",   w:230 },
  { key:"url",       label:"colUrl",       w:290, note:"noteUrl" }
];

function headerCell(col, rowspan){
  const th = el("th",{rowspan: rowspan > 1 ? String(rowspan) : null,
    class: col.key === "name" ? "c-name" : null,
    style:"min-width:"+col.w+"px;width:"+col.w+"px;"});
  th.appendChild(document.createTextNode(t(col.label)));
  if(col.required) th.appendChild(el("span",{class:"req", "aria-hidden":"true"},["*"]));
  if(col.tip) th.appendChild(el("span",{class:"info", title:t(col.tip), "aria-label":t(col.tip), tabindex:"0"},["i"]));
  if(col.note) th.appendChild(el("span",{class:"th-note"},[t(col.note)]));
  return th;
}
function renderHead(){
  const thead = el("thead",{});
  const r1 = el("tr",{class:"r1"}), r2 = el("tr",{class:"r2"});
  r1.appendChild(el("th",{rowspan:"2", class:"c-n"},["#"]));
  let groupDone = false;
  COLUMNS.forEach(col=>{
    if(col.group){
      if(!groupDone){ r1.appendChild(el("th",{colspan:"2", class:"group"},[t(col.group)])); groupDone = true; }
      r2.appendChild(headerCell(col, 1));
    } else {
      r1.appendChild(headerCell(col, 2));
    }
  });
  r1.appendChild(el("th",{rowspan:"2", style:"min-width:48px;width:48px;"},[""]));
  thead.appendChild(r1); thead.appendChild(r2);
  return thead;
}

/* ---- cell builders ---- */
function cell(colKey, extraClass){ return el("td",{"data-col":colKey, class:extraClass || null}); }
function errSlot(){ return el("div",{class:"cell-error", "aria-live":"polite"}); }

function textareaCell(s, key, colKey, placeholder, ariaLabel){
  const td = cell(colKey, colKey === "name" ? "c-name" : null);
  const obj = s;
  const ta = el("textarea",{rows:"1", placeholder:placeholder || "", "aria-label":ariaLabel});
  ta.value = obj[key] || "";
  ta.addEventListener("input", e=>{ obj[key] = e.target.value; autoGrow(ta); onEdit(); });
  td.appendChild(ta); td.appendChild(errSlot());
  return td;
}
function selectWithOther(s, idKey, otherKey, options, colKey, otherPh, ariaLabel){
  const td = cell(colKey);
  const select = el("select",{"aria-label":ariaLabel});
  select.appendChild(el("option",{value:""},[t("selectPh")]));
  options.forEach(o=> select.appendChild(el("option",{value:o.id, selected: s[idKey] === o.id},[o[STATE.ui.lang]])));
  const other = el("input",{type:"text", class:"other-input" + (s[idKey] === "other" ? "" : " hidden"), placeholder:otherPh, "aria-label":otherPh, autocomplete:"off"});
  other.value = s[otherKey] || "";
  select.addEventListener("change", e=>{
    s[idKey] = e.target.value;
    other.classList.toggle("hidden", s[idKey] !== "other");
    if(s[idKey] === "other") other.focus();
    onEdit();
  });
  other.addEventListener("input", e=>{ s[otherKey] = e.target.value; onEdit(); });
  td.appendChild(select); td.appendChild(other); td.appendChild(errSlot());
  return td;
}
function dateCells(s){
  const tdStart = cell("start");
  const start = el("input",{type:"date", "aria-label":t("colStart")});
  start.value = s.startDate;
  start.addEventListener("input", e=>{ s.startDate = e.target.value; onEdit(); });
  tdStart.appendChild(start); tdStart.appendChild(errSlot());

  const tdEnd = cell("end");
  const end = el("input",{type:"date", "aria-label":t("colEnd"), disabled:s.ongoing});
  end.value = s.endDate;
  end.addEventListener("input", e=>{ s.endDate = e.target.value; onEdit(); });
  const cb = el("input",{type:"checkbox", checked:s.ongoing});
  cb.addEventListener("change", e=>{
    s.ongoing = e.target.checked; end.disabled = s.ongoing;
    if(s.ongoing){ s.endDate = ""; end.value = ""; }
    onEdit();
  });
  tdEnd.appendChild(end);
  tdEnd.appendChild(el("label",{class:"check-inline"},[cb, t("ongoing")]));
  tdEnd.appendChild(errSlot());
  return [tdStart, tdEnd];
}
function sitesCell(s){
  const td = cell("sites");
  s.sites.forEach((val, i)=>{
    const row = el("div",{class:"site-row"});
    const input = el("input",{type:"text", placeholder:t("sitePh"), "aria-label":t("colSites") + " " + (i+1), autocomplete:"off", "data-site":String(i)});
    input.value = val;
    input.addEventListener("input", e=>{ s.sites[i] = e.target.value; onEdit(); });
    input.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); addSite(s); } });
    row.appendChild(input);
    if(s.sites.length > 1){
      row.appendChild(el("button",{type:"button", class:"mini-remove", title:t("removeSite"), "aria-label":t("removeSite"),
        onclick:()=>{ s.sites.splice(i,1); saveState(); rerenderRow(s); }},["✕"]));
    }
    td.appendChild(row);
  });
  td.appendChild(el("button",{type:"button", class:"mini-add", onclick:()=> addSite(s)},[t("addSite")]));
  return td;
}
function addSite(s){
  s.sites.push(""); saveState(); rerenderRow(s);
  const inputs = document.querySelectorAll('tr[data-row="'+s.id+'"] input[data-site]');
  if(inputs.length) inputs[inputs.length-1].focus();
}
function urlCell(s){
  const td = cell("url");
  const input = el("input",{type:"url", inputmode:"url", placeholder:"https://", "aria-label":t("colUrl"), autocomplete:"off"});
  input.value = s.url;
  input.addEventListener("input", e=>{ s.url = e.target.value; onEdit(); });
  input.addEventListener("blur", e=>{
    const n = normalizeUrl(e.target.value);
    if(n !== e.target.value){ e.target.value = n; s.url = n; onEdit(); }
    paintCell(td, studyErrors(s).url);   // show URL problems as soon as the user leaves the cell
  });
  td.appendChild(input); td.appendChild(errSlot());
  return td;
}

function renderRow(s, index){
  const tr = el("tr",{"data-row":s.id});
  tr.appendChild(el("td",{class:"c-n"},[String(index+1)]));
  tr.appendChild(textareaCell(s, "name", "name", t("namePh"), t("colName")));
  const code = el("input",{type:"text", placeholder:t("codePh"), "aria-label":t("colCode"), autocomplete:"off"});
  code.value = s.code; code.addEventListener("input", e=>{ s.code = e.target.value; onEdit(); });
  const tdCode = cell("code"); tdCode.appendChild(code); tr.appendChild(tdCode);
  tr.appendChild(selectWithOther(s, "status", "statusOther", STATUS_OPTIONS, "status", t("statusOtherPh"), t("colStatus")));
  tr.appendChild(textareaCell(s, "condition", "condition", t("conditionPh"), t("colCondition")));
  tr.appendChild(selectWithOther(s, "typeId", "typeOther", STUDY_TYPE_OPTIONS, "type", t("typeOtherPh"), t("colType")));
  dateCells(s).forEach(td => tr.appendChild(td));
  tr.appendChild(sitesCell(s));
  tr.appendChild(textareaCell(s, "sponsor", "sponsor", t("sponsorPh"), t("colSponsor")));
  tr.appendChild(urlCell(s));
  const tdDel = el("td",{});
  tdDel.appendChild(el("button",{type:"button", class:"row-remove-btn", title:t("removeStudy"), "aria-label":t("removeStudy") + " " + (index+1),
    onclick:()=> removeStudy(s)},["✕"]));
  tr.appendChild(tdDel);
  return tr;
}
function rerenderRow(s){
  const old = document.querySelector('tr[data-row="'+s.id+'"]');
  const idx = STATE.studies.indexOf(s);
  if(old){ const fresh = renderRow(s, idx); old.replaceWith(fresh); growAll(fresh); }
  if(STATE.ui.reviewing) paintErrors(false);
  refreshReview();
}
function growAll(root){ (root || document).querySelectorAll(".grid textarea").forEach(autoGrow); }

function addStudy(){
  const s = blankStudy();
  STATE.studies.push(s);
  saveState();
  const tbody = document.getElementById("gridBody");
  const tr = renderRow(s, STATE.studies.length - 1);
  tbody.appendChild(tr);
  updateCount();
  const wrap = document.querySelector(".table-wrap");
  wrap.scrollLeft = 0;
  tr.querySelector("textarea").focus();
  tr.scrollIntoView({block:"nearest"});
}
function removeStudy(s){
  if(!isEmptyStudy(s) && !window.confirm(t("removeStudyConfirm"))) return;
  STATE.studies.splice(STATE.studies.indexOf(s), 1);
  if(!STATE.studies.length) STATE.studies.push(blankStudy());
  saveState();
  renderTableBody();
  updateCount(); refreshReview(); renderErrorList();
}
function renderTableBody(){
  const tbody = document.getElementById("gridBody");
  tbody.innerHTML = "";
  STATE.studies.forEach((s, i)=> tbody.appendChild(renderRow(s, i)));
  growAll(tbody);
  if(STATE.ui.reviewing) paintErrors(false);
}
function updateCount(){
  const c = document.getElementById("studyCount");
  if(c) c.textContent = countLabel(filledStudies().length);
}

function renderTopbar(){
  const bar = el("div",{class:"topbar"});
  bar.appendChild(el("img",{class:"logo-img", src:LOGO_WHITE_DATA_URI, alt:"RARE.Qc"}));
  bar.appendChild(el("div",{class:"bar-title"},[t("surveyTitle")]));
  bar.appendChild(el("div",{class:"spacer"}));
  bar.appendChild(el("div",{class:"save-state"},[ el("span",{class:"save-dot"}), el("span",{id:"saveLabel"},[t("autosaveOn")]) ]));
  const toggle = el("div",{class:"lang-toggle", role:"group", "aria-label":"Language / Langue"});
  ["en","fr"].forEach(lang=>{
    toggle.appendChild(el("button",{type:"button", class: STATE.ui.lang === lang ? "active" : "", "aria-pressed": String(STATE.ui.lang === lang),
      onclick: ()=>{ if(STATE.ui.lang === lang) return; STATE.ui.lang = lang; saveState(); renderApp(); }}, [lang.toUpperCase()]));
  });
  bar.appendChild(toggle);
  return bar;
}

function renderApp(){
  document.documentElement.lang = isFr() ? "fr-CA" : "en-CA";
  document.title = "RARE.Qc | " + t("surveyTitle");
  const scrollY = window.scrollY;
  const prevScrollLeft = document.querySelector(".table-wrap") ? document.querySelector(".table-wrap").scrollLeft : 0;
  const root = document.getElementById("app");
  root.innerHTML = "";
  root.appendChild(renderTopbar());
  const shell = el("main",{class:"shell"});
  root.appendChild(shell);

  const hero = el("header",{class:"hero"});
  hero.appendChild(el("img",{class:"logo", src:LOGO_COLOUR_DATA_URI, alt:"RARE.Qc"}));
  hero.appendChild(el("h1",{},[t("surveyTitle")]));
  if(!STATE.ui.done){
    hero.appendChild(el("p",{html: t("introDirectory")}));   // fixed text with a link (no user input)
    hero.appendChild(el("p",{},[t("intro")]));
    hero.appendChild(el("div",{class:"save-line"},[el("span",{class:"dot"}), t("saveLine")]));
  }
  shell.appendChild(hero);

  if(STATE.ui.done){
    const n = STATE.ui.doneCount || 1;
    const done = el("section",{class:"done"});
    done.appendChild(el("div",{class:"tick"},["✓"]));
    done.appendChild(el("h2",{},[t("doneTitle")]));
    done.appendChild(el("p",{},[(n === 1 ? t("doneBody1") : t("doneBodyN").replace("{n}", n)) + " " + t("doneBody2")]));
    done.appendChild(el("button",{type:"button", class:"btn btn-primary", style:"margin-top:10px;", onclick: ()=>{
      STATE = freshState(STATE.ui.lang); saveState(); renderApp(); window.scrollTo(0,0);
    }},[t("anotherBtn")]));
    shell.appendChild(done);
    return;
  }

  // ---- table ----
  const hint = el("div",{class:"table-hint"});
  hint.appendChild(el("span",{},[t("oneRowPerStudy")]));
  hint.appendChild(el("span",{class:"count", id:"studyCount"},[countLabel(filledStudies().length)]));
  hint.appendChild(el("span",{class:"scroll-hint"},[t("scrollHint")]));
  shell.appendChild(hint);

  const wrap = el("div",{class:"table-wrap"});
  const table = el("table",{class:"grid"});
  table.appendChild(renderHead());
  table.appendChild(el("tbody",{id:"gridBody"}));
  wrap.appendChild(table);
  wrap.appendChild(el("button",{type:"button", class:"add-row-btn", onclick:addStudy},[t("addStudy")]));
  shell.appendChild(wrap);
  renderTableBody();
  // second header row sits under the first one when scrolling
  const r1 = table.querySelector("thead tr.r1 th.group");
  if(r1) table.style.setProperty("--head1-h", r1.offsetHeight + "px");
  wrap.scrollLeft = prevScrollLeft;

  shell.appendChild(el("div",{id:"errorList"}));

  // ---- Excel option: download template / import completed file ----
  const xl = el("div",{class:"excel-bar"});
  xl.appendChild(el("div",{class:"xl-icon", "aria-hidden":"true"},["XLSX"]));
  xl.appendChild(el("div",{class:"xl-text"},[el("b",{},[t("excelBarLead")]), " " + t("excelBarText")]));
  xl.appendChild(el("button",{type:"button", class:"btn btn-secondary", onclick:downloadTemplate},[t("downloadTemplate")]));
  const fileInput = el("input",{type:"file", accept:".xlsx,.xls", class:"hidden", id:"importFile"});
  fileInput.addEventListener("change", e=>{ const f = e.target.files[0]; e.target.value = ""; if(f) importExcel(f); });
  xl.appendChild(fileInput);
  xl.appendChild(el("button",{type:"button", class:"btn btn-secondary", onclick:()=> fileInput.click()},[t("importExcel")]));
  shell.appendChild(xl);
  shell.appendChild(el("div",{id:"importNotes"}));


  // ---- PI name: internal only, entered once for the studies above ----
  const pi = el("div",{class:"pi-block"});
  const piLabel = el("label",{for:"f_pi"},[t("colPi")]);
  piLabel.appendChild(el("span",{class:"internal-tag"},[t("internalTag")]));
  pi.appendChild(piLabel);
  const piInput = el("input",{id:"f_pi", type:"text", autocomplete:"off"});
  piInput.value = STATE.internal.piName;
  piInput.addEventListener("input", e=>{ STATE.internal.piName = e.target.value; scheduleAutosave(); });
  pi.appendChild(piInput);
  pi.appendChild(el("div",{class:"help"},[t("notePi")]));
  shell.appendChild(pi);

  // ---- actions ----
  const actions = el("div",{class:"actions"});
  actions.appendChild(el("div",{class:"note-save"},[el("span",{class:"dot"}), t("autosaveNote")]));
  actions.appendChild(el("button",{type:"button", class:"btn-text", onclick:clearAll},[t("clearBtn")]));
  actions.appendChild(el("button",{type:"button", class:"btn btn-primary", onclick:goToReview},[t("reviewBtn")]));
  shell.appendChild(actions);

  shell.appendChild(el("section",{class:"review" + (STATE.ui.reviewing ? "" : " hidden"), id:"review", "aria-live":"polite"}));
  refreshReview();
  if(STATE.ui.reviewing) renderErrorList();
  window.scrollTo(0, scrollY);
}

function renderErrorList(){
  const box = document.getElementById("errorList");
  if(!box) return;
  box.innerHTML = "";
  const errs = allErrors();
  if(!errs.length) return;
  const colLabel = key => { const c = COLUMNS.find(c => c.key === key); return c ? t(c.label) : key; };
  const wrap = el("div",{class:"error-list", role:"alert"});
  wrap.appendChild(el("strong",{},[t("errorsTitle")]));
  const ul = el("ul",{});
  errs.forEach(r=>{
    Object.keys(r.errors).forEach(k=>{
      ul.appendChild(el("li",{},[t("rowLabel") + " " + (r.index+1) + " — " + colLabel(k) + (isFr() ? " : " : ": ") + t(r.errors[k])]));
    });
  });
  wrap.appendChild(ul);
  box.appendChild(wrap);
}

function refreshReview(){
  const box = document.getElementById("review");
  if(!box || !STATE.ui.reviewing) return;
  const rows = filledStudies();
  const ok = rows.length && !allErrors().length;
  box.innerHTML = "";
  box.appendChild(el("h2",{},[t("reviewTitle") + " — " + countLabel(rows.length)]));
  box.appendChild(el("p",{class:"muted"},[t("reviewDesc")]));
  const ol = el("ol",{});
  rows.forEach(s=>{
    const status = s.status === "other" ? (s.statusOther.trim() || optLabel(STATUS_OPTIONS, "other")) : optLabel(STATUS_OPTIONS, s.status);
    ol.appendChild(el("li",{},[s.name.trim() || "—", el("span",{class:"meta"},[status ? "  ·  " + status : ""])]));
  });
  box.appendChild(ol);
  const actions = el("div",{class:"actions"});
  actions.appendChild(el("button",{type:"button", class:"btn btn-secondary", onclick:()=>{
    document.querySelector(".table-wrap").scrollIntoView({behavior:"smooth", block:"start"});
  }},[t("editBtn")]));
  actions.appendChild(el("button",{type:"button", class:"btn btn-primary", id:"submitBtn", disabled: !ok, onclick:submitSurvey},[t("submitBtn")]));
  box.appendChild(actions);
}

function goToReview(){
  // Normalize all URLs first (e.g. "www.lab.ca").
  STATE.studies.forEach(s=>{ s.url = normalizeUrl(s.url); });
  STATE.ui.reviewing = true;
  saveState();
  renderTableBody();
  renderErrorList();
  const box = document.getElementById("review");
  if(!filledStudies().length){
    box.classList.add("hidden");
    toast(t("noStudies"));
    const first = document.querySelector("#gridBody textarea"); if(first) first.focus();
    return;
  }
  const errs = allErrors();
  if(errs.length){
    box.classList.add("hidden");
    toast(t("toastFillRequired"));
    const firstBad = document.querySelector("#gridBody td.invalid");
    if(firstBad){
      firstBad.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
      const f = firstBad.querySelector("textarea, input, select"); if(f) setTimeout(()=> f.focus({preventScroll:true}), 350);
    }
    return;
  }
  box.classList.remove("hidden");
  refreshReview();
  box.scrollIntoView({behavior:"smooth", block:"center"});
}

/* ================== PART D2 — EXCEL TEMPLATE & IMPORT ================ */
function downloadTemplate(){
  const lang = STATE.ui.lang;
  const bin = atob(TEMPLATE_XLSX[lang]);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a = el("a",{href:URL.createObjectURL(blob), download:TEMPLATE_FILENAME[lang]});
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// Lower-case, strip accents, unify apostrophes/spaces, drop "*" and "(…)".
function norm(v){
  return String(v == null ? "" : v).normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[’‘`]/g, "'").replace(/\*/g, "").replace(/\(.*?\)/g, "").replace(/\s+/g, " ").trim().toLowerCase();
}
// Header text (EN or FR) -> field. Matched with startsWith on norm().
const IMPORT_HEADERS = {
  name:      ["name of the study", "nom de l'etude"],
  code:      ["study code", "code ou identifiant"],
  status:    ["study status", "statut de l'etude"],
  condition: ["rare disease", "maladie rare"],
  type:      ["study type", "type d'etude"],
  start:     ["start date", "date de debut"],
  end:       ["end date", "date de fin"],
  ongoing:   ["ongoing", "en cours"],
  sites:     ["sites in quebec", "sites au quebec"],
  sponsor:   ["sponsor", "promoteur"],
  url:       ["pi's research group", "site web du groupe", "pi's laboratory", "site web du laboratoire", "url"]
};
function matchOption(list, raw){
  const v = norm(raw);
  if(!v) return { id:"", other:"" };
  const hit = list.find(o => norm(o.en) === v || norm(o.fr) === v);
  if(hit) return { id:hit.id, other:"" };
  const m = String(raw).trim().match(/^(other|autre)\s*[:\-–]\s*(.+)$/i);
  if(m) return { id:"other", other:m[2].trim() };
  return { id:"other", other:String(raw).trim() };     // free text -> "Other" + that text
}
function pad2(n){ return String(n).padStart(2, "0"); }
// Excel serial number or text -> "YYYY-MM-DD" ("" if blank, null if not recognizable).
function toIsoDate(v){
  if(v === "" || v == null) return "";
  if(typeof v === "number" && isFinite(v)){
    const d = XLSX.SSF.parse_date_code(v);
    return d ? d.y + "-" + pad2(d.m) + "-" + pad2(d.d) : null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if(m) return m[1] + "-" + pad2(m[2]) + "-" + pad2(m[3]);
  m = s.match(/^(\d{4})[-\/.](\d{1,2})$/);
  if(m) return m[1] + "-" + pad2(m[2]) + "-01";
  m = s.match(/^(\d{4})$/);
  if(m) return m[1] + "-01-01";
  return null;
}
function truthy(v){ return ["yes","oui","y","o","x","true","vrai","1"].includes(norm(v)); }

function parseWorkbook(wb){
  let rows = null, headerIdx = -1;
  for(const name of wb.SheetNames){
    const r = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:""});
    const idx = r.slice(0, 25).findIndex(row => row.some(c => IMPORT_HEADERS.name.some(k => norm(c).startsWith(k))));
    if(idx >= 0){ rows = r; headerIdx = idx; break; }
  }
  if(!rows) return null;

  // Map each column by its header (works with the EN or FR template, in any column order).
  const map = {};
  rows[headerIdx].forEach((h, i)=>{
    const n = norm(h);
    Object.keys(IMPORT_HEADERS).forEach(key=>{
      if(map[key] === undefined && IMPORT_HEADERS[key].some(k => n.startsWith(k))) map[key] = i;
    });
  });

  // PI name: the labelled cell above the header row; the value is the next filled cell to its right.
  let piName = "";
  rows.slice(0, headerIdx).forEach(row=>{
    row.forEach((c, i)=>{
      const n = norm(c);
      if(!piName && (n.startsWith("principal investigator") || n.startsWith("nom du chercheur principal"))){
        const v = row.slice(i+1).find(x => String(x).trim() && !norm(x).startsWith("🔒") && !/internal only|usage interne/.test(norm(x)));
        if(v) piName = String(v).trim();
      }
    });
  });

  const get = (row, key) => map[key] === undefined ? "" : row[map[key]];
  const str = v => String(v == null ? "" : v).trim();
  const studies = [], notes = [];
  const headerLabels = rows[headerIdx];

  rows.slice(headerIdx + 1).forEach((row, k)=>{
    const excelRow = headerIdx + 2 + k;                                   // row number as shown in Excel
    if(!row.some(c => str(c))) return;                                    // empty row
    const name = str(get(row, "name"));
    const cond = norm(get(row, "condition"));
    if(/^(example|exemple)\b/.test(norm(name))) return;                   // template example row
    if(!name && (cond.startsWith("if applicable") || cond.startsWith("s'il y a lieu"))) return;  // template notes row

    const s = blankStudy();
    s.name = name;
    s.code = str(get(row, "code"));
    const st = matchOption(STATUS_OPTIONS, get(row, "status")); s.status = st.id; s.statusOther = st.other;
    s.condition = str(get(row, "condition"));
    const ty = matchOption(STUDY_TYPE_OPTIONS, get(row, "type")); s.typeId = ty.id; s.typeOther = ty.other;
    [["start","startDate"],["end","endDate"]].forEach(([key, field])=>{
      const raw = get(row, key);
      if(key === "end" && /^(ongoing|en cours|unknown|inconnue?)$/.test(norm(raw))){ s.ongoing = true; return; }
      const d = toIsoDate(raw);
      if(d === null){
        notes.push(t("excelRowLabel") + " " + excelRow + " — " + t("importDateBad").replace("{col}", str(headerLabels[map[key]])).replace("{v}", str(raw)));
      } else s[field] = d;
    });
    if(truthy(get(row, "ongoing"))){ s.ongoing = true; s.endDate = ""; }
    const sites = str(get(row, "sites")).split(/[;\n]+/).map(x => x.trim()).filter(Boolean);
    s.sites = sites.length ? sites : [""];
    s.sponsor = str(get(row, "sponsor"));
    s.url = normalizeUrl(str(get(row, "url")));
    if(!isEmptyStudy(s)) studies.push(s);
  });
  return { studies, piName, notes };
}

function renderImportNotes(notes){
  const box = document.getElementById("importNotes");
  if(!box) return;
  box.innerHTML = "";
  if(!notes || !notes.length) return;
  const w = el("div",{class:"import-notes", role:"status"});
  w.appendChild(el("button",{type:"button", class:"close", "aria-label":"OK", onclick:()=>{ box.innerHTML = ""; }},["✕"]));
  w.appendChild(el("strong",{},[t("importNotesTitle")]));
  const ul = el("ul",{});
  notes.forEach(n => ul.appendChild(el("li",{},[n])));
  w.appendChild(ul);
  box.appendChild(w);
}

function importExcel(file){
  if(typeof XLSX === "undefined"){ toast(t("toastNoLibrary")); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed = null;
    try{ parsed = parseWorkbook(XLSX.read(new Uint8Array(reader.result), {type:"array"})); }
    catch(e){ console.error("Import failed:", e); }
    if(!parsed){ toast(t("importBadFile")); return; }
    if(!parsed.studies.length){ toast(t("importNone")); return; }

    const existing = filledStudies().length;
    if(existing && !window.confirm(t("importConfirm").replace("{n}", countLabel(existing)))) return;

    const notes = parsed.notes.slice();
    if(parsed.piName){
      const cur = STATE.internal.piName.trim();
      if(!cur) STATE.internal.piName = parsed.piName;
      else if(norm(cur) !== norm(parsed.piName)) notes.push(t("importPiSkipped").replace("{v}", parsed.piName));
    }
    STATE.studies = filledStudies().concat(parsed.studies);
    saveState();
    renderApp();
    renderImportNotes(notes);
    // Check right away so anything missing is highlighted in the table.
    goToReview();
    toast(t("importedN").replace("{n}", countLabel(parsed.studies.length)));
  };
  reader.onerror = ()=> toast(t("importBadFile"));
  reader.readAsArrayBuffer(file);
}

/* ================== PART E — SUBMIT ================================= */
function fmtDate(d){ return d.toISOString().slice(0,10); }
function fmtDateTime(d){
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function safeFileToken(s){ return (s || "study").toString().trim().replace(/[^a-z0-9]+/gi, "_").slice(0,40) || "study"; }

// Public record: everything that may be shown in the directory.
// Always English (canonical) regardless of form language, as in the existing survey.
function buildPublicRecord(s){
  return {
    studyName: s.name.trim(),
    studyCode: s.code.trim(),
    studyStatus: optLabel(STATUS_OPTIONS, s.status, "en"),
    studyStatusOther: s.status === "other" ? s.statusOther.trim() : "",
    condition: s.condition.trim(),
    studyType: optLabel(STUDY_TYPE_OPTIONS, s.typeId, "en"),
    studyTypeOther: s.typeId === "other" ? s.typeOther.trim() : "",
    startDate: s.startDate,
    endDate: s.ongoing ? "" : s.endDate,
    ongoing: !!s.ongoing,
    quebecSites: s.sites.map(v => v.trim()).filter(Boolean),
    sponsor: s.sponsor.trim(),
    researchGroupOrInstitutionalUrl: s.url.trim()
  };
}
// Internal record: never for public display (one PI name for the whole submission).
function buildInternalRecord(){ return { piName: STATE.internal.piName.trim() }; }

const PUBLIC_HEADERS = ["Name of the study","Study code or ID","Study status","Study status (other, specified)",
  "Rare disease studied or general health condition","Study type","Study type (other, specified)",
  "Start date","End date","Ongoing / end date unknown","Sites in Quebec","Sponsor",
  "PI's research group website or institutional URL"];
function publicRow(p){
  return [p.studyName, p.studyCode, p.studyStatus, p.studyStatusOther, p.condition, p.studyType, p.studyTypeOther,
    p.startDate, p.endDate, p.ongoing ? "Yes" : "No", p.quebecSites.join("; "), p.sponsor, p.researchGroupOrInstitutionalUrl];
}

function buildWorkbook(records, internal, meta){
  const wb = XLSX.utils.book_new();
  const pub = [["#"].concat(PUBLIC_HEADERS)];
  records.forEach((r, i)=> pub.push([i+1].concat(publicRow(r.public))));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pub), "Studies (public)");
  const rowsInternal = [["Field","Value"],
    ["Principal Investigator (PI) name — INTERNAL ONLY, DO NOT PUBLISH", internal.piName],
    ["Applies to studies", records.map(r => r.public.studyName).join("; ")],
    ["Form language", meta.formLanguage],
    ["Submission date", meta.submissionDate]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rowsInternal), "Internal (not public)");
  return wb;
}

// One Google Sheet row per study (only sent if INCLUDE_SHEET_ROWS is true).
// Columns: Submission date | <PUBLIC_HEADERS…> | PI name (INTERNAL) | Form language
function buildSheetRows(records, internal, meta){
  return records.map(r => [meta.submissionDate].concat(publicRow(r.public), [internal.piName, meta.formLanguage]));
}

async function submitSurvey(){
  const rows = filledStudies();
  if(!rows.length || allErrors().length){ goToReview(); return; }
  if(typeof XLSX === "undefined"){ toast(t("toastNoLibrary")); return; }

  const btn = document.getElementById("submitBtn");
  if(btn){ btn.disabled = true; btn.textContent = t("submitting"); }

  try{
    const now = new Date();
    const meta = { submissionDate: fmtDateTime(now), formLanguage: STATE.ui.lang };
    const records = rows.map(s => ({ public: buildPublicRecord(s) }));
    const internal = buildInternalRecord();
    const first = records[0].public.studyName;
    const displayName = records.length === 1 ? first : first + " (+" + (records.length - 1) + " more)";
    const fileName = "RAREQc_NonRepertoriedStudies_" + safeFileToken(first) + "_" + fmtDate(now) + ".xlsx";
    const fileBase64 = XLSX.write(buildWorkbook(records, internal, meta), { bookType:"xlsx", type:"base64" });

    // Same top-level keys the existing Cloud Function already reads,
    // plus `surveyType` and the structured `studies` array.
    const payload = {
      surveyType: SURVEY_TYPE,
      labName: displayName,           // used by the existing backend as the submission's display name
      pi: internal.piName,            // internal email only
      contactPerson: "",
      resourceCount: records.length,
      submissionDate: meta.submissionDate,
      fileName: fileName,
      fileBase64: fileBase64,
      sheetRows: INCLUDE_SHEET_ROWS ? buildSheetRows(records, internal, meta) : [],
      formLanguage: meta.formLanguage,
      studies: records.map(r => r.public),   // public information, one object per study
      internal: internal                     // { piName } — never for public display
    };

    // 1) Google Sheet (the record of responses). If this fails, nothing is sent and the
    //    respondent can simply try again without creating duplicates.
    if(SHEETS_ENDPOINT){
      const sheetPayload = Object.assign({}, payload); delete sheetPayload.fileBase64;
      const r = await fetch(SHEETS_ENDPOINT, {
        method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(sheetPayload)
      });
      if(!r.ok) throw new Error("Sheet endpoint responded with status " + r.status);
    }
    // 2) Email with the Excel attachment (existing Cloud Function).
    try{
      const response = await fetch(SUBMISSION_ENDPOINT, {
        method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload)
      });
      if(!response.ok) throw new Error("Server responded with status " + response.status);
    }catch(mailErr){
      // Already saved in the Google Sheet: don't ask the respondent to resubmit (it would duplicate rows).
      if(SHEETS_ENDPOINT) console.warn("Saved to the Google Sheet, but the email step failed:", mailErr);
      else throw mailErr;
    }

    // Success: clear answers from this browser (incl. PI names) and confirm.
    const lang = STATE.ui.lang;
    STATE = freshState(lang);
    STATE.ui.done = true; STATE.ui.doneCount = records.length;
    saveState();
    renderApp();
    window.scrollTo(0,0);
    toast(t("toastSubmitSuccess"));
  }catch(err){
    console.error("Submission failed:", err);
    toast(t("toastSubmitFail"));
    if(btn){ btn.disabled = false; btn.textContent = t("submitBtn"); }
  }
}

/* ================== PART F — BOOTSTRAP ============================== */
function init(){
  const hadSaved = loadState();
  renderApp();
  if(hadSaved && !STATE.ui.done) toast(t("toastResumed"));
  // Safety nets in addition to the debounced autosave (same idea as the
  // 15-second interval in resourcesquestionnaire.html):
  setInterval(saveState, 15000);
  window.addEventListener("pagehide", saveState);
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") saveState(); });
  // Re-fit multi-line cells once web fonts have loaded.
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=> growAll());
}
document.addEventListener("DOMContentLoaded", init);
</script>
